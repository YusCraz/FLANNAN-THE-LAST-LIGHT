# Build and installation tools.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flannan-the-last-light"
version = "0.1.0"
description = "An interactive horror mystery with an AI presentation director."
readme = "README.md"
requires-python = ">=3.11"

# Backend, AI connection, and configuration dependencies.
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "pydantic>=2.7,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

# Keep the terminal game available.
[project.scripts]
flannan = "flannan.cli:run_game"

[tool.setuptools.packages.find]
where = ["src"]

# Include the browser files when packaging the application.
[tool.setuptools.package-data]
flannan = ["web/*.html", "web/*.css", "web/*.js"]